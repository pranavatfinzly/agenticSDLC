services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sdd
      POSTGRES_PASSWORD: sdd
      POSTGRES_DB: sdd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro # applied on first start only
volumes:
  pgdata:
